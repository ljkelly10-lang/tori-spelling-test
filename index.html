<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tori Spelling">
<title>Tori's Spelling Test</title>
<style>
:root{--pink:#ff5fad;--lav:#8f72ea;--ink:#34283f;--muted:#756a7e;--line:#f0d8e7;--green:#178459;--red:#c43b4b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff8fc,#fff0f8 55%,#f4efff)}
body{min-height:100vh;min-height:100dvh}.app{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 14px calc(35px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:16px}h1{margin:0;font-size:clamp(30px,8vw,46px)}.subtitle{margin:7px 0 0;color:var(--muted)}
.progress{height:11px;background:#eadff0;border-radius:999px;overflow:hidden;margin-top:18px}.progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:800;margin:8px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(78,45,91,.12)}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffe6f3;color:#bd3d80;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.badge.challenge{background:#f0eaff;color:#7357ca}
.hero{text-align:center;padding:10px 0 2px}.speaker{font-size:62px;margin:8px 0 4px}.hero h2{margin:0;font-size:24px}.hero p{margin:6px 0;color:var(--muted)}
.row,.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
button{border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:900;background:#f2e9f5;color:var(--ink);min-height:48px;touch-action:manipulation}button:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.cluebox{margin-top:18px;background:#fff8fc;border:1px solid #f2d9e7;border-radius:20px;padding:17px}.label{font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#b44b81}
.clue{font-size:19px;font-weight:850;margin-top:5px}.sentence{font-size:17px;color:var(--muted);margin-top:6px;line-height:1.4}
.answer{width:100%;margin-top:18px;border:2px solid #edd8e6;border-radius:16px;padding:15px;font-size:22px;text-align:center;outline:none}.answer:focus{border-color:var(--lav)}
.feedback{text-align:center;min-height:34px;margin-top:12px;font-size:17px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}
.reveal{display:none;text-align:center;margin-top:14px;padding:17px;border-radius:18px;background:#fff8fc;border:1px dashed #dabfd0}.word{font-size:46px;font-weight:950}
.nav{justify-content:space-between}.nav button{flex:1}.score{margin-top:15px;padding:12px;border-radius:16px;background:#faf6fc;text-align:center;color:var(--muted);font-size:14px;font-weight:800}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;min-height:18px}
.finish{display:none;text-align:center}.finish .big{font-size:64px}.pill{display:inline-block;padding:8px 12px;margin:4px;border-radius:999px;background:#fff2f8;font-weight:800}
@media(max-width:520px){.card{padding:18px}.row button{flex:1 1 46%}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Tori's Spelling Test 💗</h1>
  <p class="subtitle">Listen, type the word, and check your spelling.</p>
  <div class="progress"><div id="bar"></div></div>
  <div class="meta"><span id="count"></span><span id="scoreTop">0 correct</span></div>
</header>

<section class="card" id="testCard">
  <span class="badge" id="badge">Spelling Word</span>
  <div class="hero"><div class="speaker">🔊</div><h2>Listen and spell</h2><p>Tap Hear Word to play the recording.</p></div>

  <div class="row">
    <button class="primary" id="hearWord">🔊 Hear Word</button>
    <button id="hearSentence">🗣️ Hear Sentence</button>
  </div>
  <div id="audioStatus" class="status">Audio is built into this page.</div>

  <div class="cluebox">
    <div class="label">Clue</div><div class="clue" id="clue"></div>
    <div class="label" style="margin-top:14px">Sentence</div><div class="sentence" id="sentence"></div>
  </div>

  <input id="answer" class="answer" placeholder="Type the spelling…" autocomplete="off" autocapitalize="none" spellcheck="false">

  <div class="row">
    <button class="primary" id="check">Check Answer</button>
    <button id="hint">💡 Hint</button>
    <button id="show">Show Word</button>
  </div>

  <div id="feedback" class="feedback"></div>
  <div id="reveal" class="reveal"><div id="word" class="word"></div></div>

  <div class="nav">
    <button id="prev">← Back</button>
    <button id="shuffle">🔀 Shuffle</button>
    <button class="primary" id="next">Next →</button>
  </div>
  <div id="score" class="score">Score: 0 correct out of 0 answers</div>
</section>

<section class="card finish" id="finish">
  <div class="big">🌟</div>
  <h2>Great job!</h2>
  <p id="finalScore"></p>
  <div id="missed"></div>
  <div class="row"><button class="primary" id="restart">Start Over</button></div>
</section>
</div>

let cards=[...original],i=0,correct=0,checks=0,scored=false,missed=new Set(),player=new Audio();
const $=id=>document.getElementById(id),answer=$("answer");
function c(){return cards[i]}

function play(src,label){
  try{
    player.pause();
    player=new Audio(src);
    player.volume=1;
    $("audioStatus").textContent="Starting audio…";
    const p=player.play();
    if(p && p.then){
      p.then(()=>$("audioStatus").textContent="Playing "+label+"…")
       .catch(()=>fallbackSpeak(label));
    }
    player.onended=()=>$("audioStatus").textContent="Tap again to replay.";
  }catch(e){fallbackSpeak(label)}
}
function fallbackSpeak(text){
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US";u.rate=.75;u.volume=1;
      u.onstart=()=>$("audioStatus").textContent="Playing with iPhone voice…";
      u.onend=()=>$("audioStatus").textContent="Tap again to replay.";
      u.onerror=()=>$("audioStatus").textContent="Audio could not play. Check volume and reload Safari.";
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  $("audioStatus").textContent="Audio could not play. Check volume and reload Safari.";
}

function render(){
 const x=c();scored=false;
 $("count").textContent=`${i+1} of ${cards.length}`;
 $("bar").style.width=`${((i+1)/cards.length)*100}%`;
 $("badge").textContent=x.challenge?"⭐ Challenge Word":"Spelling Word";
 $("badge").className="badge"+(x.challenge?" challenge":"");
 $("clue").textContent=x.clue;
 $("sentence").textContent=x.sentence.replace(new RegExp("\\b"+x.word+"\\b","i"),"_____");
 $("word").textContent=x.word;
 $("reveal").style.display="none";
 $("feedback").textContent="";
 answer.value="";
 $("scoreTop").textContent=`${correct} correct`;
 $("score").textContent=`Score: ${correct} correct out of ${checks} answers`;
 $("audioStatus").textContent="Audio is built into this page.";
}

$("hearWord").onclick=()=>play(c().wordAudio,c().word);
$("hearSentence").onclick=()=>play(c().sentenceAudio,c().sentence);

$("check").onclick=()=>{
 const v=answer.value.trim().toLowerCase();if(!v)return;
 const ok=v===c().word.toLowerCase(),f=$("feedback");
 if(!scored){
   checks++;scored=true;
   if(ok){correct++;missed.delete(c().word)} else missed.add(c().word);
 }
 f.textContent=ok?"✅ Correct! Great job!":"❌ Not quite. Try again!";
 f.className="feedback "+(ok?"good":"bad");
 $("scoreTop").textContent=`${correct} correct`;
 $("score").textContent=`Score: ${correct} correct out of ${checks} answers`;
};
$("hint").onclick=()=>{
 $("feedback").textContent=`💡 Starts with "${c().word[0].toUpperCase()}" • ${c().word.length} letters`;
 $("feedback").className="feedback";
};
$("show").onclick=()=>{$("reveal").style.display=$("reveal").style.display==="block"?"none":"block"};
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("next").onclick=()=>{
 if(i===cards.length-1){
   $("testCard").style.display="none";$("finish").style.display="block";
   $("finalScore").textContent=`You got ${correct} out of ${checks} correct.`;
   const m=$("missed");m.innerHTML="";
   if(missed.size){
     const p=document.createElement("p");p.textContent="Words to practice:";m.appendChild(p);
     [...missed].forEach(w=>{const s=document.createElement("span");s.className="pill";s.textContent=w;m.appendChild(s)});
   }
 }else{i++;render()}
};
$("shuffle").onclick=()=>{
 for(let j=cards.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}
 i=0;correct=0;checks=0;missed.clear();render()
};
$("restart").onclick=()=>{
 cards=[...original];i=0;correct=0;checks=0;missed.clear();
 $("finish").style.display="none";$("testCard").style.display="block";render()
};
answer.addEventListener("keydown",e=>{if(e.key==="Enter")$("check").click()});
render();
</script>
</body>
</html>
