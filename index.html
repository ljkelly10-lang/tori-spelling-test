<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tori Spelling">
<title>Tori's Spelling Test</title>
<style>
:root{--pink:#ff5fad;--lav:#8f72ea;--ink:#34283f;--muted:#756a7e;--line:#f0d8e7;--green:#178459;--red:#c43b4b}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff8fc,#fff0f8 55%,#f4efff)}
body{min-height:100vh;min-height:100dvh}.app{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 14px calc(35px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:16px}h1{margin:0;font-size:clamp(30px,8vw,46px)}.subtitle{margin:7px 0 0;color:var(--muted)}
.progress{height:11px;background:#eadff0;border-radius:999px;overflow:hidden;margin-top:18px}.progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav))}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:800;margin:8px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(78,45,91,.12)}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffe6f3;color:#bd3d80;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.badge.challenge{background:#f0eaff;color:#7357ca}.badge.review{background:#eaf8ff;color:#2e6f91}.badge.retry{background:#fff3d9;color:#9a6916}
.hero{text-align:center;padding:10px 0 2px}.speaker{font-size:62px;margin:8px 0 4px}.hero h2{margin:0;font-size:24px}.hero p{margin:6px 0;color:var(--muted)}
.row,.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
button{border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:900;background:#f2e9f5;color:var(--ink);min-height:48px;touch-action:manipulation}button:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px;min-height:18px}
.cluebox{margin-top:18px;background:#fff8fc;border:1px solid #f2d9e7;border-radius:20px;padding:17px}.label{font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#b44b81}
.clue{font-size:19px;font-weight:850;margin-top:5px}.sentence{font-size:17px;color:var(--muted);margin-top:6px}
.answer{width:100%;margin-top:18px;border:2px solid #edd8e6;border-radius:16px;padding:15px;font-size:22px;text-align:center;outline:none;text-transform:lowercase}.answer:focus{border-color:var(--lav)}
.feedback{text-align:center;min-height:34px;margin-top:12px;font-size:17px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}
.reveal{display:none;text-align:center;margin-top:14px;padding:17px;border-radius:18px;background:#fff8fc;border:1px dashed #dabfd0}.word{font-size:46px;font-weight:950}
.nav{justify-content:space-between}.nav button{flex:1}.score{margin-top:15px;padding:12px;border-radius:16px;background:#faf6fc;text-align:center;color:var(--muted);font-size:14px;font-weight:800}
.finish{display:none;text-align:center}.finish .big{font-size:64px}
@media(max-width:520px){.card{padding:18px}.row button{flex:1 1 46%}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Tori's Spelling Test 💗</h1>
<p class="subtitle">Spelling List 2 • Hear the word, then spell it aloud or type it.</p>
<div class="progress"><div id="bar"></div></div>
<div class="meta"><span id="count"></span><span id="scoreTop">0 correct</span></div>
</header>
<section class="card" id="testCard">
<span class="badge" id="badge">Spelling Word</span>
<div class="hero"><div class="speaker">🔊</div><h2>Listen and spell</h2><p>Tap Hear Word. It will say the word twice, then listen for her spelling.</p></div>
<div class="row"><button class="primary" id="hearWord">🔊 Hear Word</button><button id="hearSentence">🗣️ Hear Sentence</button></div>
<div class="cluebox"><div class="label">Clue</div><div class="clue" id="clue"></div><div class="label" style="margin-top:14px">Sentence</div><div class="sentence" id="sentence"></div></div>
<input id="answer" class="answer" placeholder="Type the spelling…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" writingsuggestions="false" enterkeyhint="done">
<div class="row">
  <button class="primary" id="check">Check Typed Answer</button>
  <button id="hint">💡 Hint</button>
  <button id="show">Show Word</button>
</div>
<div id="feedback" class="feedback"></div><div id="reveal" class="reveal"><div id="word" class="word"></div></div>
<div class="nav"><button id="prev">← Back</button><button id="shuffle">🔀 Shuffle</button><button class="primary" id="next">Next →</button></div>
<div id="score" class="score">Score: 0 correct out of 0 answers</div>
</section>
<section class="card finish" id="finish"><div class="big">🌟</div><h2>Great job!</h2><p id="finalScore"></p><button class="primary" id="restart">Start Over</button></section>
</div>
<script>
const original=[{"word":"kept","clue":"Held onto or continued to have something.","sentence":"She kept her favorite drawing in a folder.","category":"regular"},{"word":"speech","clue":"Words spoken to a group of people.","sentence":"He gave a short speech in front of the class.","category":"regular"},{"word":"breath","clue":"The air you take into or let out of your lungs.","sentence":"Take a deep breath before you begin.","category":"regular"},{"word":"hello","clue":"A word used to greet someone.","sentence":"She smiled and said hello to her teacher.","category":"regular"},{"word":"reason","clue":"An explanation for why something happened.","sentence":"Tell me the reason you chose that answer.","category":"regular"},{"word":"squeeze","clue":"To press something firmly from the sides.","sentence":"Squeeze the sponge to get the water out.","category":"regular"},{"word":"else","clue":"In addition to or instead of something.","sentence":"Does anyone else want to play?","category":"regular"},{"word":"lesson","clue":"Something taught or learned.","sentence":"Today's math lesson was about fractions.","category":"regular"},{"word":"meant","clue":"Intended or had a particular meaning.","sentence":"I meant to put my book in my backpack.","category":"regular"},{"word":"sweater","clue":"A warm piece of clothing worn on the upper body.","sentence":"She wore a sweater because it was chilly.","category":"regular"},{"word":"breathe","clue":"To take air into and let it out of your lungs.","sentence":"Remember to breathe slowly and stay calm.","category":"regular"},{"word":"freedom","clue":"The ability to act, speak, or choose freely.","sentence":"The flag can represent freedom.","category":"regular"},{"word":"repeat","clue":"To say or do something again.","sentence":"Please repeat the directions one more time.","category":"regular"},{"word":"wealth","clue":"A large amount of money, valuable things, or resources.","sentence":"The story described a family with great wealth.","category":"regular"},{"word":"length","clue":"The measurement of how long something is.","sentence":"We measured the length of the table.","category":"regular"},{"word":"leather","clue":"A strong material made from animal hide.","sentence":"The brown belt was made of leather.","category":"regular"},{"word":"safety","clue":"Being protected from danger or harm.","sentence":"We wear helmets for safety.","category":"regular"},{"word":"album","clue":"A collection of photos, music, or memories.","sentence":"We looked through the family photo album.","category":"regular"},{"word":"waste","clue":"To use something carelessly or unnecessarily.","sentence":"Try not to waste food or water.","category":"review"},{"word":"master","clue":"To learn or do something very well.","sentence":"She practiced until she could master the skill.","category":"review"},{"word":"a lot","clue":"A large amount or a great number.","sentence":"We learned a lot during science class.","category":"challenge"},{"word":"all right","clue":"Okay, acceptable, or satisfactory.","sentence":"It is all right to ask for help.","category":"challenge"}];
let cards=[...original],i=0,correct=0,checks=0,scored=false,player=new Audio();
let missedFirstPass=new Map();
let retryUnresolved=new Set();
let retryRoundAdded=false;
const $=id=>document.getElementById(id),answer=$("answer");
function c(){return cards[i]}
let systemVoices=[];

function refreshVoices(){
  if("speechSynthesis" in window){
    systemVoices=window.speechSynthesis.getVoices() || [];
  }
}

function chooseClearVoice(){
  refreshVoices();
  const preferred=["Samantha","Ava","Allison","Susan","Nicky","Joelle","Tom"];
  for(const name of preferred){
    const match=systemVoices.find(v =>
      v.name.toLowerCase().includes(name.toLowerCase()) &&
      /^en(-|_)?US/i.test(v.lang || "en-US")
    );
    if(match) return match;
  }
  return systemVoices.find(v => /^en(-|_)?US/i.test(v.lang || "")) ||
         systemVoices.find(v => /^en/i.test(v.lang || "")) ||
         null;
}

function makeUtterance(textToSay, rate=0.68){
  const u=new SpeechSynthesisUtterance(textToSay);
  u.lang="en-US";
  u.rate=rate;
  u.pitch=1.0;
  u.volume=1.0;
  const voice=chooseClearVoice();
  if(voice) u.voice=voice;
  return u;
}

function speakWordClearly(word){
  if(!("speechSynthesis" in window)){
    alert("Audio is not available in this browser. Please open the spelling test in Safari.");
    return;
  }

  if(activeRecognition){
    try{activeRecognition.abort();}catch(e){}
  }
  window.speechSynthesis.cancel();

  const first=makeUtterance(word,0.64);
  const second=makeUtterance(word,0.58);

  first.onerror=()=>alert("The voice did not start. Tap Hear Word again.");
  second.onerror=()=>alert("The voice did not start. Tap Hear Word again.");

  first.onend=()=>{
    setTimeout(()=>window.speechSynthesis.speak(second),420);
  };

  second.onend=()=>{
    // Give the phone a moment so its own voice is not picked up by the mic.
    setTimeout(startListeningForSpelling,650);
  };

  window.speechSynthesis.speak(first);
}

function speakSentenceClearly(textToSay){
  if(!("speechSynthesis" in window)){
    alert("Audio is not available in this browser. Please open the spelling test in Safari.");
    return;
  }
  if(activeRecognition){
    try{activeRecognition.abort();}catch(e){}
  }
  window.speechSynthesis.cancel();
  const u=makeUtterance(textToSay,0.72);
  window.speechSynthesis.speak(u);
}

if("speechSynthesis" in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged=refreshVoices;
}

function render(){
 const x=c();scored=false;$("count").textContent=`${i+1} of ${cards.length}`;$("bar").style.width=`${((i+1)/cards.length)*100}%`;
 if(x.retry){
   $("badge").textContent="↩ Practice Again"; $("badge").className="badge retry";
 }else if(x.category==="challenge"){
   $("badge").textContent="⭐ Challenge Word"; $("badge").className="badge challenge";
 }else if(x.category==="review"){
   $("badge").textContent="🔁 Review Word"; $("badge").className="badge review";
 }else{
   $("badge").textContent="Spelling Word"; $("badge").className="badge";
 }
 $("clue").textContent=x.clue;$("sentence").textContent=x.sentence.replace(new RegExp("\\b"+x.word+"\\b","i"),"_____");$("word").textContent=x.word;
 $("reveal").style.display="none";$("feedback").textContent="";answer.value="";$("scoreTop").textContent=`${correct} correct`;$("score").textContent=`Score: ${correct} correct out of ${checks} answers`;
}
$("hearWord").onclick=()=>speakWordClearly(c().word);
$("hearSentence").onclick=()=>speakSentenceClearly(c().sentence);



function normalizeAnswerForCheck(value){
  return (value || "").toLowerCase().replace(/[^a-z]/g,"");
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null;

const spokenLetterMap = new Map([
  ["a","a"],["ay","a"],["hey","a"],["eh","a"],
  ["b","b"],["bee","b"],["be","b"],
  ["c","c"],["see","c"],["sea","c"],
  ["d","d"],["dee","d"],
  ["e","e"],["ee","e"],["eee","e"],
  ["f","f"],["ef","f"],["eff","f"],
  ["g","g"],["gee","g"],["jee","g"],
  ["h","h"],["aitch","h"],["haitch","h"],
  ["i","i"],["eye","i"],
  ["j","j"],["jay","j"],
  ["k","k"],["kay","k"],["kaye","k"],
  ["l","l"],["el","l"],["ell","l"],
  ["m","m"],["em","m"],
  ["n","n"],["en","n"],
  ["o","o"],["oh","o"],
  ["p","p"],["pee","p"],["pea","p"],
  ["q","q"],["cue","q"],["queue","q"],
  ["r","r"],["are","r"],["ar","r"],
  ["s","s"],["ess","s"],
  ["t","t"],["tee","t"],["tea","t"],
  ["u","u"],["you","u"],["yew","u"],
  ["v","v"],["vee","v"],
  ["w","w"],["doubleyou","w"],["double-u","w"],["doubleu","w"],
  ["x","x"],["ex","x"],
  ["y","y"],["why","y"],
  ["z","z"],["zee","z"],["zed","z"]
]);

function normalizeAnswerForCheck(value){
  return (value || "").toLowerCase().replace(/[^a-z]/g,"");
}

function transcriptToLetters(raw){
  let cleaned=(raw||"")
    .toLowerCase()
    .replace(/[.,!?;:]/g," ")
    .replace(/\b(letter|letters|capital|lowercase|uppercase)\b/g," ")
    .replace(/\bdouble\s+u\b/g,"doubleyou")
    .replace(/\s+/g," ")
    .trim();

  if(!cleaned) return "";

  const expected=normalizeAnswerForCheck(c().word);
  const compact=normalizeAnswerForCheck(cleaned);

  // iPhone often collapses a clearly-spelled sequence into the finished word.
  // Accept that transcript because the phone may have combined the letters.
  if(compact===expected) return expected;

  const tokens=cleaned.split(/[\s-]+/).filter(Boolean);
  const letters=[];

  for(const token of tokens){
    if(spokenLetterMap.has(token)){
      letters.push(spokenLetterMap.get(token));
      continue;
    }

    // Sometimes Safari groups several individually spoken letters into one token.
    if(/^[a-z]{1,5}$/.test(token)){
      for(const ch of token) letters.push(ch);
    }
  }
  return letters.join("");
}

function editDistance(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}

function showListeningMessage(msg){
  const f=$("feedback");
  f.textContent=msg;
  f.className="feedback";
}


function recordFirstAttempt(ok){
  if(c().retry){
    if(ok) retryUnresolved.delete(c().word);
    return;
  }
  if(!ok && !missedFirstPass.has(c().word)){
    missedFirstPass.set(c().word,{...c()});
  }
}

function addMissedWordsToEnd(){
  if(retryRoundAdded || missedFirstPass.size===0) return false;

  const retryWords=[...missedFirstPass.values()].map(x=>({...x,retry:true}));

  // Shuffle the missed words so the practice round feels mixed.
  for(let j=retryWords.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [retryWords[j],retryWords[k]]=[retryWords[k],retryWords[j]];
  }

  retryUnresolved=new Set(retryWords.map(x=>x.word));
  cards.push(...retryWords);
  retryRoundAdded=true;
  return true;
}

function finishSpokenAttempt(candidates){
  const expected=normalizeAnswerForCheck(c().word);
  const unique=[...new Set(candidates.filter(Boolean))];

  if(!unique.length){
    showListeningMessage("I couldn't make out the letters. Tap Hear Word and try again.");
    return;
  }

  // Choose the closest transcript among the phone's alternatives,
  // but never silently change it into the correct answer.
  unique.sort((a,b)=>editDistance(a,expected)-editDistance(b,expected));
  const heard=unique[0];
  const ok=heard===expected;
  const f=$("feedback");

  if(!scored){
    checks++;
    scored=true;
    recordFirstAttempt(ok);
    if(ok) correct++;
  }

  if(ok){
    f.textContent="✅ Correct! Great job!";
    f.className="feedback good";
  }else{
    const spaced=heard.split("").join(" ");
    f.textContent=`❌ I heard: ${spaced}. Tap Hear Word and try again.`;
    f.className="feedback bad";
  }

  $("scoreTop").textContent=`${correct} correct`;
  $("score").textContent=`Score: ${correct} correct out of ${checks} answers`;
}

function startListeningForSpelling(){
  if(!SpeechRecognitionAPI){
    showListeningMessage("Mic listening is not available in this browser. She can still type the answer.");
    return;
  }

  try{
    if(activeRecognition){
      try{activeRecognition.abort();}catch(e){}
    }

    const recognition=new SpeechRecognitionAPI();
    activeRecognition=recognition;
    recognition.lang="en-US";
    recognition.continuous=true;
    recognition.interimResults=true;
    recognition.maxAlternatives=5;

    let candidates=[];
    let stopTimer=null;

    showListeningMessage("🎤 Listening… spell each letter slowly with a tiny pause.");

    function scheduleStop(delay=1800){
      clearTimeout(stopTimer);
      stopTimer=setTimeout(()=>{
        try{recognition.stop();}catch(e){}
      },delay);
    }

    recognition.onstart=()=>scheduleStop(7000);

    recognition.onresult=(event)=>{
      for(let r=event.resultIndex;r<event.results.length;r++){
        const result=event.results[r];
        for(let a=0;a<result.length;a++){
          const parsed=transcriptToLetters(result[a].transcript||"");
          if(parsed) candidates.push(parsed);
        }
      }
      // Keep listening briefly after the latest recognized sound.
      scheduleStop(1700);
    };

    recognition.onerror=(event)=>{
      clearTimeout(stopTimer);
      if(event.error==="not-allowed" || event.error==="service-not-allowed"){
        showListeningMessage("Please allow microphone access for this site, or use the typing box.");
      }else if(event.error==="no-speech"){
        showListeningMessage("I didn't hear anything. Tap Hear Word and try again.");
      }else if(event.error!=="aborted"){
        showListeningMessage("I couldn't hear the spelling clearly. Tap Hear Word and try again.");
      }
    };

    recognition.onend=()=>{
      clearTimeout(stopTimer);
      activeRecognition=null;
      finishSpokenAttempt(candidates);
    };

    recognition.start();
  }catch(e){
    showListeningMessage("Mic listening couldn't start. She can still type the answer.");
  }
}

$("check").onclick=()=>{let raw=answer.value.trim();if(!raw)return;let v=normalizeAnswerForCheck(raw);let expected=normalizeAnswerForCheck(c().word);let ok=v===expected,f=$("feedback");if(!scored){checks++;scored=true;recordFirstAttempt(ok);if(ok)correct++}f.textContent=ok?"✅ Correct! Great job!":"❌ Not quite. Try again!";f.className="feedback "+(ok?"good":"bad");$("scoreTop").textContent=`${correct} correct`;$("score").textContent=`Score: ${correct} correct out of ${checks} answers`};
$("hint").onclick=()=>{
 const letters=c().word.replace(/[^a-z]/gi,"");
 const wordCount=c().word.trim().split(/\s+/).length;
 $("feedback").textContent=`💡 Starts with "${letters[0].toUpperCase()}" • ${letters.length} letters${wordCount>1?` • ${wordCount} words`:""}`;
 $("feedback").className="feedback";
};
$("show").onclick=()=>{$("reveal").style.display=$("reveal").style.display==="block"?"none":"block"};
$("prev").onclick=()=>{if(i>0){i--;render()}};
$("next").onclick=()=>{
  if(i===cards.length-1){
    if(addMissedWordsToEnd()){
      i++;
      render();
      $("feedback").textContent="💗 Missed words have been mixed back in for another try.";
      $("feedback").className="feedback";
    }else{
      $("testCard").style.display="none";
      $("finish").style.display="block";
      if(retryRoundAdded){
        $("finalScore").textContent=retryUnresolved.size===0
          ? "Great job! You practiced every missed word again and got them all."
          : `You finished the practice round. ${retryUnresolved.size} word${retryUnresolved.size===1?"":"s"} still need a little more practice.`;
      }else{
        $("finalScore").textContent=`You got ${correct} out of ${checks} correct. No missed words needed to be repeated.`;
      }
    }
  }else{
    i++;
    render();
  }
};
$("shuffle").onclick=()=>{cards=[...original];for(let j=cards.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]]}i=0;correct=0;checks=0;missedFirstPass=new Map();retryUnresolved=new Set();retryRoundAdded=false;render()};
$("restart").onclick=()=>{cards=[...original];i=0;correct=0;checks=0;missedFirstPass=new Map();retryUnresolved=new Set();retryRoundAdded=false;$("finish").style.display="none";$("testCard").style.display="block";render()};
answer.addEventListener("input",()=>{
  const start=answer.selectionStart, end=answer.selectionEnd;
  const lower=answer.value.toLowerCase();
  if(answer.value!==lower){
    answer.value=lower;
    try{answer.setSelectionRange(start,end);}catch(e){}
  }
});
answer.addEventListener("keydown",e=>{if(e.key==="Enter")$("check").click()});
render();
</script>
</body>
</html>
